<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #7ec8f2;
    font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    overscroll-behavior: none;
  }
  .wrap {
    position: relative;
    width: 100%;
    max-width: 660px;
    margin: 0 auto;
    background: linear-gradient(#8fd3ff, #cdeaff);
    border: 3px solid #2b3a55;
    border-radius: 10px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    background: #2b3a55;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
  }
  canvas#game {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    background: transparent;
    touch-action: none;
  }
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    background: #2b3a55;
  }
  .controls button {
    font-size: 20px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 2px solid #1a2438;
    background: #4d6a9e;
    color: #fff;
    cursor: pointer;
    touch-action: manipulation;
  }
  .controls button:active { background: #34507a; }
  .hint {
    text-align: center;
    font-size: 11px;
    color: #2b3a55;
    padding: 4px 6px 8px;
    background: #cdeaff;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(10, 16, 32, 0.72);
    color: #fff;
    text-align: center;
    padding: 20px;
  }
  .overlay h1 { margin: 0; font-size: 26px; }
  .overlay p { margin: 0; font-size: 13px; line-height: 1.6; opacity: 0.9; }
  .overlay .stats { font-size: 15px; font-weight: 600; line-height: 1.9; }
  .overlay .newbest { color: #ffcc33; font-weight: 800; }
  .overlay button {
    margin-top: 6px;
    font-size: 16px;
    font-weight: 700;
    padding: 10px 22px;
    border-radius: 10px;
    border: none;
    background: #ffcc33;
    color: #2b3a55;
    cursor: pointer;
  }
  .overlay button:hover { background: #ffd966; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="topbar">
    <span>🏃 무한 러너</span>
    <span id="bestLabel">최고 기록: 0</span>
  </div>
  <div style="position:relative;">
    <canvas id="game" width="640" height="384"></canvas>
    <div class="overlay" id="startScreen">
      <h1>무한 러너</h1>
      <p>땅이 점점 더 빠르게 다가와요. 스페이스바 / W / ↑ 로 점프!<br/>
         공중에서 한 번 더 누르면 2단 점프도 가능해요.<br/>
         구멍에 빠지거나 가시·적에 부딪히면 끝이에요. 최대한 오래 버텨보세요!</p>
      <button id="startBtn">시작하기</button>
    </div>
    <div class="overlay hidden" id="gameOverScreen">
      <h1>게임 오버</h1>
      <div class="stats" id="gameOverStats"></div>
      <button id="retryBtn">다시 시작</button>
    </div>
  </div>
  <div class="controls" style="justify-content:center;">
    <button id="btnJump">⤒ 점프 (2단 점프 가능)</button>
  </div>
  <div class="hint">스페이스 / W / ↑ 점프 · 공중에서 한 번 더 눌러 2단 점프 · 적은 밟아서 처치</div>
</div>

<script>
(function () {
  "use strict";

  var TILESET_B64 = "__TILESET_B64__";
  var CHARSET_B64 = "__CHARSET_B64__";

  var TILE = 32;
  var TILE_SRC = 19;
  var TILE_ART = 18; // tile art is 18x18; the 19px stride leaves a 1px transparent gap
  var CHAR_SRC = 25;

  var SPR = {
    // row 0: grass top with a border on every side, including the bottom -
    // the "floating" piece for when nothing continues below it
    topFloatIsolated: [0, 0],
    topFloatCapLeft: [1, 0],
    topFloatMid: [2, 0],
    topFloatCapRight: [3, 0],
    // row 1: grass top with no bottom border at all - the "connected" piece
    // for when more ground continues directly below it
    topIsolated: [0, 1],
    topCapLeft: [1, 1],
    topMid: [2, 1],
    topCapRight: [3, 1],
    bottomIsolated: [0, 7],
    bottomCapLeft: [1, 7],
    bottomMid: [2, 7],
    bottomCapRight: [3, 7],
    spike: [8, 3],
    coin: [11, 7]
  };
  var CHAR = {
    playerA: [2, 0],
    playerB: [3, 0],
    enemyA: [6, 2],
    enemyB: [7, 2]
  };

  var GRAVITY = 1700;
  var JUMP_VELOCITY = 620;
  var ENEMY_SPEED = 60;
  var MAX_FALL = 900;
  var VIEW_W = 640;
  var VIEW_H = 384;
  var ROWS = 12;
  var GROUND_TOP_ROW = 10;
  var GROUND_BOTTOM_ROW = 11;
  var PLAYER_OFFSET_X = 130; // the player's screen x is locked this far from the camera's left edge
  var MAX_JUMPS = 2; // double jump

  // the ground is generated forever, but only ever rendered/collided with
  // near the camera, so a fixed-size ring buffer (reused cyclically as the
  // world scrolls past) keeps memory bounded instead of growing without end
  var RING_TILES = 256;

  var BASE_SCROLL = 110;    // px/s at the very start
  var MAX_SCROLL = 260;     // px/s once fully ramped up
  var DIFFICULTY_RAMP_TIME = 90; // seconds to reach max difficulty
  var LOOKAHEAD_TILES = 20; // keep this many tiles generated beyond the right edge

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  var tilesetImg = new Image();
  var charsetImg = new Image();
  var assetsReady = 0;
  function onAssetReady() {
    assetsReady++;
  }
  tilesetImg.onload = onAssetReady;
  charsetImg.onload = onAssetReady;
  tilesetImg.src = "data:image/png;base64," + TILESET_B64;
  charsetImg.src = "data:image/png;base64," + CHARSET_B64;

  var ringCanvas = document.createElement("canvas");
  ringCanvas.width = RING_TILES * TILE_ART;
  ringCanvas.height = ROWS * TILE_ART;
  var ringCtx = ringCanvas.getContext("2d");
  ringCtx.imageSmoothingEnabled = false;

  function lerp(a, b, t) { return a + (b - a) * t; }
  function randInt(min, max) { return Math.floor(min + Math.random() * (max - min + 1)); }

  function overlapTiles(rect) {
    return {
      x0: Math.floor(rect.x / TILE),
      x1: Math.floor((rect.x + rect.w - 1) / TILE),
      y0: Math.floor(rect.y / TILE),
      y1: Math.floor((rect.y + rect.h - 1) / TILE)
    };
  }

  function solidAt(col, row) {
    if (row !== GROUND_TOP_ROW && row !== GROUND_BOTTOM_ROW) return false;
    if (col < 0) return true; // invisible wall before the very start
    return solidRing[col % RING_TILES];
  }

  function moveX(ent, dx) {
    ent.x += dx;
    var t = overlapTiles(ent);
    if (dx > 0) {
      for (var ty = t.y0; ty <= t.y1; ty++) {
        if (solidAt(t.x1, ty)) { ent.x = t.x1 * TILE - ent.w; break; }
      }
    } else if (dx < 0) {
      for (var ty2 = t.y0; ty2 <= t.y1; ty2++) {
        if (solidAt(t.x0, ty2)) { ent.x = (t.x0 + 1) * TILE; break; }
      }
    }
  }

  function moveY(ent, dy) {
    ent.y += dy;
    ent.onGround = false;
    var t = overlapTiles(ent);
    if (dy > 0) {
      for (var tx = t.x0; tx <= t.x1; tx++) {
        if (solidAt(tx, t.y1)) {
          ent.y = t.y1 * TILE - ent.h;
          ent.vy = 0;
          ent.onGround = true;
          break;
        }
      }
    } else if (dy < 0) {
      for (var tx2 = t.x0; tx2 <= t.x1; tx2++) {
        if (solidAt(tx2, t.y0)) {
          ent.y = (t.y0 + 1) * TILE;
          ent.vy = 0;
          break;
        }
      }
    }
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // ---- audio ----
  var actx = null;
  function beep(freq, dur, type, gain) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = actx.createOscillator();
      var g = actx.createGain();
      osc.type = type || "square";
      osc.frequency.value = freq;
      g.gain.value = gain || 0.06;
      osc.connect(g);
      g.connect(actx.destination);
      osc.start();
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      osc.stop(actx.currentTime + dur);
    } catch (e) { /* audio not available */ }
  }
  var sfx = {
    jump: function () { beep(520, 0.12, "square", 0.05); },
    coin: function () { beep(880, 0.08, "square", 0.05); beep(1320, 0.08, "square", 0.04); },
    hit: function () { beep(140, 0.25, "sawtooth", 0.07); },
    stomp: function () { beep(220, 0.1, "square", 0.06); }
  };

  // ---- world generation ----
  var solidRing = new Array(RING_TILES).fill(false);
  var genCol, genMode;
  var coins, spikes, enemies;

  function clearRingColumn(col) {
    var ringIdx = col % RING_TILES;
    ringCtx.clearRect(ringIdx * TILE_ART, 0, TILE_ART, ROWS * TILE_ART);
  }

  function drawGroundColumn(col, pos) {
    var ringIdx = col % RING_TILES;
    var topSpr = pos === "mid" ? SPR.topMid : pos === "left" ? SPR.topCapLeft : pos === "right" ? SPR.topCapRight : SPR.topIsolated;
    var botSpr = pos === "mid" ? SPR.bottomMid : pos === "left" ? SPR.bottomCapLeft : pos === "right" ? SPR.bottomCapRight : SPR.bottomIsolated;
    ringCtx.drawImage(tilesetImg, topSpr[0] * TILE_SRC, topSpr[1] * TILE_SRC, TILE_ART, TILE_ART,
      ringIdx * TILE_ART, GROUND_TOP_ROW * TILE_ART, TILE_ART, TILE_ART);
    ringCtx.drawImage(tilesetImg, botSpr[0] * TILE_SRC, botSpr[1] * TILE_SRC, TILE_ART, TILE_ART,
      ringIdx * TILE_ART, GROUND_BOTTOM_ROW * TILE_ART, TILE_ART, TILE_ART);
  }

  function placeGroundSegment(len, difficulty, safe) {
    var startCol = genCol;
    var endCol = genCol + len - 1;
    var spikeCol = -1;
    if (!safe && len >= 3 && Math.random() < lerp(0.12, 0.35, difficulty)) {
      spikeCol = startCol + 1 + Math.floor(Math.random() * (len - 2));
    }
    var wantEnemy = !safe && len >= 5 && Math.random() < lerp(0.05, 0.22, difficulty);
    var enemyCol = wantEnemy ? startCol + 1 + Math.floor(Math.random() * (len - 2)) : -1;
    var wantCoins = len >= 3 && Math.random() < 0.55;
    var coinCount = 0, coinStart = -1;
    if (wantCoins) {
      coinCount = Math.min(len - 2, 3 + Math.floor(Math.random() * 3));
      coinStart = startCol + Math.max(1, Math.floor((len - coinCount) / 2));
    }

    for (var c = startCol; c <= endCol; c++) {
      solidRing[c % RING_TILES] = true;
      var pos = (c === startCol && c === endCol) ? "iso" : c === startCol ? "left" : c === endCol ? "right" : "mid";
      drawGroundColumn(c, pos);

      if (c === spikeCol) {
        spikes.push({ x: c * TILE + (TILE - 24) / 2, y: GROUND_TOP_ROW * TILE - 16, w: 24, h: 16, col: c });
      }
      if (wantCoins && c >= coinStart && c < coinStart + coinCount) {
        coins.push({ x: c * TILE + 6, y: (GROUND_TOP_ROW - 2) * TILE, w: 20, h: 20, taken: false, col: c });
      }
      if (c === enemyCol) {
        enemies.push({
          x: c * TILE + 3, y: GROUND_TOP_ROW * TILE - 6, w: 26, h: 22,
          vx: 0, vy: 0, dir: -1, onGround: false, alive: true, animT: 0
        });
      }
    }
    genCol = endCol + 1;
  }

  function placeGap(len) {
    var startCol = genCol;
    var endCol = genCol + len - 1;
    for (var c = startCol; c <= endCol; c++) {
      solidRing[c % RING_TILES] = false;
      clearRingColumn(c);
    }
    genCol = endCol + 1;
  }

  function ensureGenerated(targetCol) {
    while (genCol < targetCol) {
      var difficulty = Math.min(1, elapsed / DIFFICULTY_RAMP_TIME);
      if (genMode === "ground") {
        var isFirst = genCol === 0;
        var len = isFirst ? 14 : randInt(Math.round(lerp(6, 3, difficulty)), Math.round(lerp(10, 6, difficulty)));
        placeGroundSegment(len, difficulty, isFirst);
        genMode = "gap";
      } else {
        var gapLen = randInt(1, Math.round(lerp(2, 3, difficulty)));
        placeGap(gapLen);
        genMode = "ground";
      }
    }
  }

  function pruneEntities(cutoffX) {
    coins = coins.filter(function (c) { return !c.taken && c.x + c.w > cutoffX; });
    spikes = spikes.filter(function (s) { return s.x + s.w > cutoffX; });
    enemies = enemies.filter(function (e) { return e.alive && e.x + e.w > cutoffX; });
  }

  // ---- game state ----
  var state = "start"; // start, playing, gameover
  var player, camX, coinCount, elapsed, scrollSpeed, keys, best = 0;

  try { best = parseInt(localStorage.getItem("runner_best") || "0", 10) || 0; } catch (e) { /* storage unavailable */ }
  document.getElementById("bestLabel").textContent = "최고 기록: " + best;

  function resetGame() {
    solidRing.fill(false);
    ringCtx.clearRect(0, 0, ringCanvas.width, ringCanvas.height);
    genCol = 0;
    genMode = "ground";
    coins = [];
    spikes = [];
    enemies = [];
    elapsed = 0;
    scrollSpeed = BASE_SCROLL;
    coinCount = 0;
    camX = 0;
    ensureGenerated(LOOKAHEAD_TILES + Math.ceil(VIEW_W / TILE));
    player = {
      x: PLAYER_OFFSET_X, y: GROUND_TOP_ROW * TILE - 20, w: 22, h: 28,
      vy: 0, onGround: false, facing: 1, animT: 0, jumpsUsed: 0, jumpHeld: false
    };
  }

  function die() {
    if (state !== "playing") return;
    state = "gameover";
    sfx.hit();
    var distance = Math.floor(camX / TILE);
    var finalScore = distance + coinCount * 5;
    var isNew = finalScore > best;
    if (isNew) {
      best = finalScore;
      try { localStorage.setItem("runner_best", String(best)); } catch (e) { /* storage unavailable */ }
    }
    document.getElementById("bestLabel").textContent = "최고 기록: " + best;
    document.getElementById("gameOverStats").innerHTML =
      "이동 거리: " + distance + "m<br/>" +
      "동전: " + coinCount + "개<br/>" +
      "점수: " + finalScore +
      (isNew ? "<br/><span class=\"newbest\">🏆 신기록!</span>" : "");
    show("gameOverScreen");
  }

  function show(id) {
    ["startScreen", "gameOverScreen"].forEach(function (n) {
      document.getElementById(n).classList.toggle("hidden", n !== id);
    });
  }
  function hideAll() {
    ["startScreen", "gameOverScreen"].forEach(function (n) {
      document.getElementById(n).classList.add("hidden");
    });
  }

  // ---- input ----
  keys = {};
  var keyMap = {
    ArrowUp: "jump", KeyW: "jump", Space: "jump"
  };
  window.addEventListener("keydown", function (e) {
    var k = keyMap[e.code];
    if (k) { keys[k] = true; e.preventDefault(); }
    if (e.code === "Space" && state !== "playing") {
      e.preventDefault();
    }
  }, { passive: false });
  window.addEventListener("keyup", function (e) {
    var k = keyMap[e.code];
    if (k) { keys[k] = false; e.preventDefault(); }
  }, { passive: false });

  function bindHold(id, key) {
    var el = document.getElementById(id);
    var set = function (v) { return function (ev) { keys[key] = v; ev.preventDefault(); }; };
    el.addEventListener("pointerdown", set(true));
    el.addEventListener("pointerup", set(false));
    el.addEventListener("pointerleave", set(false));
    el.addEventListener("pointercancel", set(false));
  }
  bindHold("btnJump", "jump");

  document.getElementById("startBtn").addEventListener("click", function () {
    resetGame();
    state = "playing";
    hideAll();
  });
  document.getElementById("retryBtn").addEventListener("click", function () {
    resetGame();
    state = "playing";
    hideAll();
  });

  // ---- update ----
  function updatePlayer(dt) {
    // no manual left/right anymore - the player is glued to a fixed spot on
    // screen and the world scrolls underneath; only jump timing matters
    player.x = camX + PLAYER_OFFSET_X;

    var jumpPressed = keys.jump && !player.jumpHeld;
    player.jumpHeld = keys.jump;
    if (jumpPressed && (player.onGround || player.jumpsUsed < MAX_JUMPS)) {
      player.vy = -JUMP_VELOCITY;
      player.onGround = false;
      player.jumpsUsed++;
      sfx.jump();
    }

    player.vy += GRAVITY * dt;
    if (player.vy > MAX_FALL) player.vy = MAX_FALL;

    moveY(player, player.vy * dt);
    if (player.onGround) player.jumpsUsed = 0;

    player.animT += dt; // always running

    if (player.y > ROWS * TILE + 80) { die(); return; }

    var prect = { x: player.x, y: player.y, w: player.w, h: player.h };
    for (var i = 0; i < coins.length; i++) {
      var coin = coins[i];
      if (coin.taken) continue;
      if (rectsOverlap(prect, coin)) {
        coin.taken = true;
        coinCount++;
        sfx.coin();
      }
    }
    for (var s = 0; s < spikes.length; s++) {
      if (rectsOverlap(prect, spikes[s])) { die(); return; }
    }
    for (var e = 0; e < enemies.length; e++) {
      var en = enemies[e];
      if (!en.alive) continue;
      if (rectsOverlap(prect, en)) {
        if (player.vy > 40 && (player.y + player.h) - en.y < 16) {
          en.alive = false;
          player.vy = -JUMP_VELOCITY * 0.55;
          coinCount += 2;
          sfx.stomp();
        } else {
          die();
          return;
        }
      }
    }
  }

  function updateEnemies(dt) {
    for (var i = 0; i < enemies.length; i++) {
      var en = enemies[i];
      if (!en.alive) continue;
      en.animT += dt;

      var aheadX = en.dir > 0 ? en.x + en.w + 2 : en.x - 2;
      var aheadCol = Math.floor(aheadX / TILE);
      var groundRow = Math.floor((en.y + en.h + 2) / TILE);
      var midRow = Math.floor((en.y + en.h / 2) / TILE);
      var groundAhead = solidAt(aheadCol, groundRow);
      var wallAhead = solidAt(aheadCol, midRow);
      if (!groundAhead || wallAhead) en.dir *= -1;

      en.vy += GRAVITY * dt;
      if (en.vy > MAX_FALL) en.vy = MAX_FALL;
      moveX(en, en.dir * ENEMY_SPEED * dt);
      moveY(en, en.vy * dt);
    }
  }

  // ---- render ----
  function drawSprite(img, srcCoord, stride, dx, dy, dw, dh, flip, cropSize) {
    var size = cropSize || stride;
    var sx = srcCoord[0] * stride;
    var sy = srcCoord[1] * stride;
    if (flip) {
      ctx.save();
      ctx.translate(dx + dw, dy);
      ctx.scale(-1, 1);
      ctx.drawImage(img, sx, sy, size, size, 0, 0, dw, dh);
      ctx.restore();
    } else {
      ctx.drawImage(img, sx, sy, size, size, dx, dy, dw, dh);
    }
  }

  function drawBackground() {
    var grd = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    grd.addColorStop(0, "#8fd3ff");
    grd.addColorStop(1, "#e7f7ff");
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    for (var i = 0; i < 6; i++) {
      var bx = ((i * 260) - camX * 0.3) % (VIEW_W + 200) - 100;
      var by = 30 + (i % 3) * 40;
      roundRect(bx, by, 70, 22, 10);
      roundRect(bx + 24, by - 10, 50, 22, 10);
    }
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function drawGround() {
    // the ring buffer is a persistent bitmap at native resolution; blit the
    // visible strip in one or two scaled draws (two only when the strip
    // straddles the ring's wrap point) so there's no per-tile scaling seam
    var col0 = Math.floor(camX / TILE);
    var colCount = Math.ceil(VIEW_W / TILE) + 2;
    var destX0 = col0 * TILE - camX;
    var ringStart = ((col0 % RING_TILES) + RING_TILES) % RING_TILES;
    var firstPart = Math.min(colCount, RING_TILES - ringStart);

    ctx.drawImage(
      ringCanvas,
      ringStart * TILE_ART, 0, firstPart * TILE_ART, ROWS * TILE_ART,
      destX0, 0, firstPart * TILE, ROWS * TILE
    );
    var remaining = colCount - firstPart;
    if (remaining > 0) {
      ctx.drawImage(
        ringCanvas,
        0, 0, remaining * TILE_ART, ROWS * TILE_ART,
        destX0 + firstPart * TILE, 0, remaining * TILE, ROWS * TILE
      );
    }

    for (var i = 0; i < coins.length; i++) {
      var coin = coins[i];
      if (coin.taken) continue;
      var bob = Math.sin((performance.now() / 300) + coin.col) * 3;
      drawSprite(tilesetImg, SPR.coin, TILE_SRC, coin.x - camX, coin.y + bob, coin.w, coin.h, false, TILE_ART);
    }
    for (var s = 0; s < spikes.length; s++) {
      var sp = spikes[s];
      drawSprite(tilesetImg, SPR.spike, TILE_SRC, sp.x - camX, sp.y, sp.w, sp.h, false, TILE_ART);
    }
  }

  function drawEnemies() {
    for (var i = 0; i < enemies.length; i++) {
      var en = enemies[i];
      if (!en.alive) continue;
      var frame = Math.floor(en.animT * 6) % 2 === 0 ? CHAR.enemyA : CHAR.enemyB;
      drawSprite(charsetImg, frame, CHAR_SRC, en.x - camX, en.y, en.w, en.h, en.dir < 0);
    }
  }

  function drawPlayer() {
    var frame = player.animT > 0 && Math.floor(player.animT * 8) % 2 === 0 ? CHAR.playerB : CHAR.playerA;
    drawSprite(charsetImg, frame, CHAR_SRC, player.x - camX - 3, player.y - 2, player.w + 8, player.h + 6, player.facing < 0);
  }

  function drawHUD() {
    var distance = Math.floor(camX / TILE);
    ctx.fillStyle = "rgba(26,36,56,0.55)";
    ctx.fillRect(8, 8, 130, 30);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 15px sans-serif";
    ctx.textBaseline = "middle";
    ctx.fillText(distance + "m", 16, 24);

    drawSprite(tilesetImg, SPR.coin, TILE_SRC, VIEW_W - 90, 10, 20, 20, false, TILE_ART);
    ctx.fillStyle = "#1a2438";
    ctx.textAlign = "left";
    ctx.fillText("x " + coinCount, VIEW_W - 62, 22);
  }

  var lastTime = null;
  function loop(ts) {
    if (lastTime === null) lastTime = ts;
    var dt = Math.min((ts - lastTime) / 1000, 0.033);
    lastTime = ts;

    if (assetsReady >= 2) {
      if (state === "playing") {
        elapsed += dt;
        var difficulty = Math.min(1, elapsed / DIFFICULTY_RAMP_TIME);
        scrollSpeed = lerp(BASE_SCROLL, MAX_SCROLL, difficulty);
        camX += scrollSpeed * dt;

        ensureGenerated(Math.ceil((camX + VIEW_W) / TILE) + LOOKAHEAD_TILES);
        pruneEntities(camX - 200);

        updatePlayer(dt);
        if (state === "playing") updateEnemies(dt);
      }
      drawBackground();
      if (player) {
        drawGround();
        drawEnemies();
        drawPlayer();
        drawHUD();
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
