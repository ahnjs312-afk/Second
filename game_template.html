<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #7ec8f2;
    font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    overscroll-behavior: none;
  }
  .wrap {
    position: relative;
    width: 100%;
    max-width: 660px;
    margin: 0 auto;
    background: linear-gradient(#8fd3ff, #cdeaff);
    border: 3px solid #2b3a55;
    border-radius: 10px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    background: #2b3a55;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
  }
  canvas#game {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    background: transparent;
    touch-action: none;
  }
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    background: #2b3a55;
  }
  .dpad { display: flex; gap: 8px; }
  .controls button {
    font-size: 20px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 2px solid #1a2438;
    background: #4d6a9e;
    color: #fff;
    cursor: pointer;
    touch-action: manipulation;
  }
  .controls button:active { background: #34507a; }
  .hint {
    text-align: center;
    font-size: 11px;
    color: #2b3a55;
    padding: 4px 6px 8px;
    background: #cdeaff;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(10, 16, 32, 0.72);
    color: #fff;
    text-align: center;
    padding: 20px;
  }
  .overlay h1 { margin: 0; font-size: 26px; }
  .overlay p { margin: 0; font-size: 13px; line-height: 1.6; opacity: 0.9; }
  .overlay button {
    margin-top: 6px;
    font-size: 16px;
    font-weight: 700;
    padding: 10px 22px;
    border-radius: 10px;
    border: none;
    background: #ffcc33;
    color: #2b3a55;
    cursor: pointer;
  }
  .overlay button:hover { background: #ffd966; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="topbar">
    <span>🎮 픽셀 플랫포머</span>
    <span id="levelLabel">Level 1</span>
  </div>
  <div style="position:relative;">
    <canvas id="game" width="640" height="384"></canvas>
    <div class="overlay" id="startScreen">
      <h1>픽셀 플랫포머</h1>
      <p>방향키 또는 A/D로 이동, 스페이스바/W/↑로 점프해요.<br/>
         동전을 모으고 가시와 적을 피해서 깃발까지 가면 클리어!<br/>
         적은 위에서 밟으면 처치할 수 있어요.</p>
      <button id="startBtn">시작하기</button>
    </div>
    <div class="overlay hidden" id="gameOverScreen">
      <h1>게임 오버</h1>
      <p id="gameOverScore"></p>
      <button id="retryBtn">다시 시작</button>
    </div>
    <div class="overlay hidden" id="levelCompleteScreen">
      <h1>레벨 클리어! 🎉</h1>
      <p id="levelCompleteScore"></p>
      <button id="nextLevelBtn">다음 레벨</button>
    </div>
    <div class="overlay hidden" id="winScreen">
      <h1>축하합니다! 🏆</h1>
      <p id="winScore"></p>
      <button id="restartAllBtn">처음부터 다시</button>
    </div>
  </div>
  <div class="controls">
    <div class="dpad">
      <button id="btnLeft">◀</button>
      <button id="btnRight">▶</button>
    </div>
    <button id="btnJump">⤒ 점프</button>
  </div>
  <div class="hint">방향키 / A D 이동 · 스페이스 / W / ↑ 점프 · 적은 밟아서 처치</div>
</div>

<script>
(function () {
  "use strict";

  var TILESET_B64 = "__TILESET_B64__";
  var CHARSET_B64 = "__CHARSET_B64__";
  var LEVELS_RAW = __LEVELS_JSON__;

  var TILE = 32;
  var TILE_SRC = 19;
  var TILE_ART = 18; // tile art is 18x18; the 19px stride leaves a 1px transparent gap
  var CHAR_SRC = 25;

  var SPR = {
    // row 0: grass top with a border on every side, including the bottom -
    // the "floating" piece for when nothing continues below it
    topFloatIsolated: [0, 0],
    topFloatCapLeft: [1, 0],
    topFloatMid: [2, 0],
    topFloatCapRight: [3, 0],
    // row 1: grass top with no bottom border at all - the "connected" piece
    // for when more ground continues directly below it
    topIsolated: [0, 1],
    topCapLeft: [1, 1],
    topMid: [2, 1],
    topCapRight: [3, 1],
    fillCore: [0, 6],
    bottomIsolated: [0, 7],
    bottomCapLeft: [1, 7],
    bottomMid: [2, 7],
    bottomCapRight: [3, 7],
    spike: [4, 3],
    coin: [11, 7],
    flagA: [11, 5],
    flagB: [12, 5],
    heartFull: [4, 2],
    heartEmpty: [6, 2]
  };
  var CHAR = {
    playerA: [2, 0],
    playerB: [3, 0],
    enemyA: [6, 2],
    enemyB: [7, 2]
  };

  var GRAVITY = 1700;
  var JUMP_VELOCITY = 620;
  var MOVE_SPEED = 190;
  var ENEMY_SPEED = 60;
  var MAX_FALL = 900;
  var VIEW_W = 640;
  var VIEW_H = 384;
  var MAX_LIVES = 3;

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  var tilesetImg = new Image();
  var charsetImg = new Image();
  var assetsReady = 0;
  function onAssetReady() {
    assetsReady++;
  }
  tilesetImg.onload = onAssetReady;
  charsetImg.onload = onAssetReady;
  tilesetImg.src = "data:image/png;base64," + TILESET_B64;
  charsetImg.src = "data:image/png;base64," + CHARSET_B64;

  function parseLevel(rows) {
    var R = rows.length;
    var C = rows[0].length;
    var solid = [];
    var coins = [];
    var spikes = [];
    var enemiesInit = [];
    var flag = null;
    var spawn = { c: 1, r: R - 3 };
    for (var r = 0; r < R; r++) {
      var rowArr = [];
      for (var c = 0; c < C; c++) {
        var ch = rows[r][c];
        rowArr.push(ch === "#");
        if (ch === "C") coins.push({ c: c, r: r, taken: false });
        else if (ch === "^") spikes.push({ c: c, r: r });
        else if (ch === "E") enemiesInit.push({ c: c, r: r });
        else if (ch === "F") flag = { c: c, r: r };
        else if (ch === "P") spawn = { c: c, r: r };
      }
      solid.push(rowArr);
    }
    return {
      C: C, R: R, solid: solid, coins: coins, spikes: spikes,
      enemiesInit: enemiesInit, flag: flag, spawn: spawn, bitmap: null
    };
  }

  function buildLevelBitmap(lvl) {
    // Composite all ground tiles onto an offscreen canvas at native (unscaled)
    // resolution first, then the whole thing is scaled up in one blit. Scaling
    // each 18px tile up to 32px individually leaves hairline seams at tile
    // edges (browser sampling rounds each drawImage call independently); a
    // single blit of the assembled bitmap has no internal seams to round.
    var off = document.createElement("canvas");
    off.width = lvl.C * TILE_ART;
    off.height = lvl.R * TILE_ART;
    var octx = off.getContext("2d");
    octx.imageSmoothingEnabled = false;

    function pickPiece(set, leftSolid, rightSolid) {
      if (leftSolid && rightSolid) return set.mid;
      if (!leftSolid && rightSolid) return set.capLeft;
      if (leftSolid && !rightSolid) return set.capRight;
      return set.isolated;
    }
    // the tileset ships a left-cap / middle / right-cap / isolated set for
    // every combination of "does ground continue above/below this tile" -
    // picking the matching piece makes every edge flush by construction, so
    // there's nothing left over to paint or backfill
    var TOP_FLOAT_SET = { isolated: SPR.topFloatIsolated, capLeft: SPR.topFloatCapLeft, mid: SPR.topFloatMid, capRight: SPR.topFloatCapRight };
    var TOP_SET = { isolated: SPR.topIsolated, capLeft: SPR.topCapLeft, mid: SPR.topMid, capRight: SPR.topCapRight };
    var BOTTOM_SET = { isolated: SPR.bottomIsolated, capLeft: SPR.bottomCapLeft, mid: SPR.bottomMid, capRight: SPR.bottomCapRight };

    for (var r = 0; r < lvl.R; r++) {
      for (var c = 0; c < lvl.C; c++) {
        if (!lvl.solid[r][c]) continue;
        var above = r > 0 && lvl.solid[r - 1][c];
        var below = r < lvl.R - 1 && lvl.solid[r + 1][c];
        var leftSolid = c > 0 && lvl.solid[r][c - 1];
        var rightSolid = c < lvl.C - 1 && lvl.solid[r][c + 1];

        var spr;
        if (!above && !below) spr = pickPiece(TOP_FLOAT_SET, leftSolid, rightSolid);
        else if (!above) spr = pickPiece(TOP_SET, leftSolid, rightSolid);
        else if (!below) spr = pickPiece(BOTTOM_SET, leftSolid, rightSolid);
        else spr = SPR.fillCore;

        octx.drawImage(
          tilesetImg,
          spr[0] * TILE_SRC, spr[1] * TILE_SRC, TILE_ART, TILE_ART,
          c * TILE_ART, r * TILE_ART, TILE_ART, TILE_ART
        );
      }
    }
    return off;
  }

  var levels = LEVELS_RAW.map(parseLevel);

  function solidAt(level, tx, ty) {
    if (ty >= level.R) return false;
    if (ty < 0) return false;
    if (tx < 0 || tx >= level.C) return true;
    return level.solid[ty][tx];
  }

  function overlapTiles(rect) {
    return {
      x0: Math.floor(rect.x / TILE),
      x1: Math.floor((rect.x + rect.w - 1) / TILE),
      y0: Math.floor(rect.y / TILE),
      y1: Math.floor((rect.y + rect.h - 1) / TILE)
    };
  }

  function moveX(level, ent, dx) {
    ent.x += dx;
    var t = overlapTiles(ent);
    if (dx > 0) {
      for (var ty = t.y0; ty <= t.y1; ty++) {
        if (solidAt(level, t.x1, ty)) { ent.x = t.x1 * TILE - ent.w; break; }
      }
    } else if (dx < 0) {
      for (var ty2 = t.y0; ty2 <= t.y1; ty2++) {
        if (solidAt(level, t.x0, ty2)) { ent.x = (t.x0 + 1) * TILE; break; }
      }
    }
  }

  function moveY(level, ent, dy) {
    ent.y += dy;
    ent.onGround = false;
    var t = overlapTiles(ent);
    if (dy > 0) {
      for (var tx = t.x0; tx <= t.x1; tx++) {
        if (solidAt(level, tx, t.y1)) {
          ent.y = t.y1 * TILE - ent.h;
          ent.vy = 0;
          ent.onGround = true;
          break;
        }
      }
    } else if (dy < 0) {
      for (var tx2 = t.x0; tx2 <= t.x1; tx2++) {
        if (solidAt(level, tx2, t.y0)) {
          ent.y = (t.y0 + 1) * TILE;
          ent.vy = 0;
          break;
        }
      }
    }
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function tileRect(c, r, w, h, alignBottom) {
    w = w || TILE; h = h || TILE;
    var x = c * TILE + (TILE - w) / 2;
    var y = alignBottom ? (r + 1) * TILE - h : r * TILE + (TILE - h) / 2;
    return { x: x, y: y, w: w, h: h };
  }

  // ---- audio ----
  var actx = null;
  function beep(freq, dur, type, gain) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = actx.createOscillator();
      var g = actx.createGain();
      osc.type = type || "square";
      osc.frequency.value = freq;
      g.gain.value = gain || 0.06;
      osc.connect(g);
      g.connect(actx.destination);
      osc.start();
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      osc.stop(actx.currentTime + dur);
    } catch (e) { /* audio not available */ }
  }
  var sfx = {
    jump: function () { beep(520, 0.12, "square", 0.05); },
    coin: function () { beep(880, 0.08, "square", 0.05); beep(1320, 0.08, "square", 0.04); },
    hit: function () { beep(140, 0.25, "sawtooth", 0.07); },
    stomp: function () { beep(220, 0.1, "square", 0.06); },
    win: function () { beep(660, 0.12, "square", 0.05); beep(880, 0.12, "square", 0.05); beep(1100, 0.18, "square", 0.05); }
  };

  // ---- game state ----
  var state = "start"; // start, playing, gameover, levelcomplete, win
  var levelIndex = 0;
  var level = null;
  var player, enemies, camX, score, lives, invulnT, bannerT, flagTime, keys;

  function loadLevel(idx) {
    levelIndex = idx;
    level = levels[idx];
    var sp = level.spawn;
    player = {
      x: sp.c * TILE + 4, y: sp.r * TILE - 20, w: 22, h: 28,
      vx: 0, vy: 0, onGround: false, facing: 1, animT: 0, dead: false
    };
    enemies = level.enemiesInit.map(function (e) {
      return {
        x: e.c * TILE + 3, y: e.r * TILE - 6, w: 26, h: 22,
        vx: 0, vy: 0, dir: -1, onGround: false, alive: true, animT: 0
      };
    });
    camX = 0;
    invulnT = 0;
    bannerT = 1.6;
    flagTime = 0;
    document.getElementById("levelLabel").textContent = "Level " + (idx + 1) + " / " + levels.length;
  }

  function resetGame() {
    score = 0;
    lives = MAX_LIVES;
    loadLevel(0);
  }

  function damagePlayer() {
    if (invulnT > 0 || state !== "playing") return;
    lives--;
    sfx.hit();
    if (lives <= 0) {
      state = "gameover";
      document.getElementById("gameOverScore").textContent =
        "모은 동전: " + score + "개";
      show("gameOverScreen");
    } else {
      var sp = level.spawn;
      player.x = sp.c * TILE + 4;
      player.y = sp.r * TILE - 20;
      player.vx = 0; player.vy = 0;
      invulnT = 1.4;
    }
  }

  function completeLevel() {
    if (state !== "playing") return;
    sfx.win();
    if (levelIndex + 1 < levels.length) {
      state = "levelcomplete";
      document.getElementById("levelCompleteScore").textContent =
        "현재 동전: " + score + "개  ·  목숨: " + lives;
      show("levelCompleteScreen");
    } else {
      state = "win";
      document.getElementById("winScore").textContent =
        "총 동전: " + score + "개  ·  남은 목숨: " + lives;
      show("winScreen");
      try {
        var best = parseInt(localStorage.getItem("platformer_best") || "0", 10);
        if (score > best) localStorage.setItem("platformer_best", String(score));
      } catch (e) { /* storage unavailable */ }
    }
  }

  function show(id) {
    ["startScreen", "gameOverScreen", "levelCompleteScreen", "winScreen"].forEach(function (n) {
      document.getElementById(n).classList.toggle("hidden", n !== id);
    });
  }
  function hideAll() {
    ["startScreen", "gameOverScreen", "levelCompleteScreen", "winScreen"].forEach(function (n) {
      document.getElementById(n).classList.add("hidden");
    });
  }

  // ---- input ----
  keys = {};
  var keyMap = {
    ArrowLeft: "left", KeyA: "left",
    ArrowRight: "right", KeyD: "right",
    ArrowUp: "jump", KeyW: "jump", Space: "jump"
  };
  window.addEventListener("keydown", function (e) {
    var k = keyMap[e.code];
    if (k) { keys[k] = true; e.preventDefault(); }
    if (e.code === "Space" && state !== "playing") {
      e.preventDefault();
    }
  }, { passive: false });
  window.addEventListener("keyup", function (e) {
    var k = keyMap[e.code];
    if (k) { keys[k] = false; e.preventDefault(); }
  }, { passive: false });

  function bindHold(id, key) {
    var el = document.getElementById(id);
    var set = function (v) { return function (ev) { keys[key] = v; ev.preventDefault(); }; };
    el.addEventListener("pointerdown", set(true));
    el.addEventListener("pointerup", set(false));
    el.addEventListener("pointerleave", set(false));
    el.addEventListener("pointercancel", set(false));
  }
  bindHold("btnLeft", "left");
  bindHold("btnRight", "right");
  bindHold("btnJump", "jump");

  document.getElementById("startBtn").addEventListener("click", function () {
    resetGame();
    state = "playing";
    hideAll();
  });
  document.getElementById("retryBtn").addEventListener("click", function () {
    resetGame();
    state = "playing";
    hideAll();
  });
  document.getElementById("nextLevelBtn").addEventListener("click", function () {
    loadLevel(levelIndex + 1);
    state = "playing";
    hideAll();
  });
  document.getElementById("restartAllBtn").addEventListener("click", function () {
    resetGame();
    state = "playing";
    hideAll();
  });

  // ---- update ----
  function updatePlayer(dt) {
    var moving = false;
    if (keys.left) { player.vx = -MOVE_SPEED; player.facing = -1; moving = true; }
    else if (keys.right) { player.vx = MOVE_SPEED; player.facing = 1; moving = true; }
    else { player.vx = 0; }

    if (keys.jump && player.onGround) {
      player.vy = -JUMP_VELOCITY;
      player.onGround = false;
      sfx.jump();
    }

    player.vy += GRAVITY * dt;
    if (player.vy > MAX_FALL) player.vy = MAX_FALL;

    moveX(level, player, player.vx * dt);
    moveY(level, player, player.vy * dt);

    if (moving) player.animT += dt;
    else player.animT = 0;

    if (invulnT > 0) invulnT -= dt;

    if (player.y > level.R * TILE + 80) {
      damagePlayer();
    }

    // coins
    var prect = { x: player.x, y: player.y, w: player.w, h: player.h };
    for (var i = 0; i < level.coins.length; i++) {
      var coin = level.coins[i];
      if (coin.taken) continue;
      var cr = tileRect(coin.c, coin.r, 20, 20, false);
      if (rectsOverlap(prect, cr)) {
        coin.taken = true;
        score++;
        sfx.coin();
      }
    }
    // spikes
    for (var s = 0; s < level.spikes.length; s++) {
      var sp = level.spikes[s];
      var sr = tileRect(sp.c, sp.r, 22, 16, true);
      if (rectsOverlap(prect, sr)) { damagePlayer(); break; }
    }
    // flag
    if (level.flag) {
      var fr = tileRect(level.flag.c, level.flag.r, 20, 30, true);
      if (rectsOverlap(prect, fr)) completeLevel();
    }
    // enemies
    for (var e = 0; e < enemies.length; e++) {
      var en = enemies[e];
      if (!en.alive) continue;
      if (rectsOverlap(prect, en)) {
        if (player.vy > 40 && (player.y + player.h) - en.y < 16) {
          en.alive = false;
          player.vy = -JUMP_VELOCITY * 0.55;
          score += 2;
          sfx.stomp();
        } else {
          damagePlayer();
        }
      }
    }
  }

  function updateEnemies(dt) {
    for (var i = 0; i < enemies.length; i++) {
      var en = enemies[i];
      if (!en.alive) continue;
      en.animT += dt;

      var aheadX = en.dir > 0 ? en.x + en.w + 2 : en.x - 2;
      var aheadCol = Math.floor(aheadX / TILE);
      var groundRow = Math.floor((en.y + en.h + 2) / TILE);
      var midRow = Math.floor((en.y + en.h / 2) / TILE);
      var groundAhead = solidAt(level, aheadCol, groundRow);
      var wallAhead = solidAt(level, aheadCol, midRow);
      if (!groundAhead || wallAhead) en.dir *= -1;

      en.vy += GRAVITY * dt;
      if (en.vy > MAX_FALL) en.vy = MAX_FALL;
      moveX(level, en, en.dir * ENEMY_SPEED * dt);
      moveY(level, en, en.vy * dt);
    }
  }

  function updateCamera() {
    var target = player.x + player.w / 2 - VIEW_W / 2;
    var maxCam = Math.max(0, level.C * TILE - VIEW_W);
    camX = Math.floor(Math.max(0, Math.min(target, maxCam)));
  }

  // ---- render ----
  function drawSprite(img, srcCoord, stride, dx, dy, dw, dh, flip, cropSize) {
    var size = cropSize || stride;
    var sx = srcCoord[0] * stride;
    var sy = srcCoord[1] * stride;
    if (flip) {
      ctx.save();
      ctx.translate(dx + dw, dy);
      ctx.scale(-1, 1);
      ctx.drawImage(img, sx, sy, size, size, 0, 0, dw, dh);
      ctx.restore();
    } else {
      ctx.drawImage(img, sx, sy, size, size, dx, dy, dw, dh);
    }
  }

  function drawBackground() {
    var grd = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    grd.addColorStop(0, "#8fd3ff");
    grd.addColorStop(1, "#e7f7ff");
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    for (var i = 0; i < 6; i++) {
      var bx = ((i * 260) - camX * 0.3) % (VIEW_W + 200) - 100;
      var by = 30 + (i % 3) * 40;
      roundRect(bx, by, 70, 22, 10);
      roundRect(bx + 24, by - 10, 50, 22, 10);
    }
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function drawLevel() {
    if (!level.bitmap) level.bitmap = buildLevelBitmap(level);
    var scale = TILE / TILE_ART;
    var srcX = camX / scale;
    var srcW = VIEW_W / scale;
    ctx.drawImage(
      level.bitmap,
      srcX, 0, srcW, level.R * TILE_ART,
      0, 0, VIEW_W, VIEW_H
    );
    for (var i = 0; i < level.coins.length; i++) {
      var coin = level.coins[i];
      if (coin.taken) continue;
      var bob = Math.sin((performance.now() / 300) + coin.c) * 3;
      var cr = tileRect(coin.c, coin.r, 20, 20, false);
      drawSprite(tilesetImg, SPR.coin, TILE_SRC, cr.x - camX, cr.y + bob, cr.w, cr.h, false, TILE_ART);
    }
    for (var s = 0; s < level.spikes.length; s++) {
      var sp = level.spikes[s];
      var sr = tileRect(sp.c, sp.r, 24, 20, true);
      drawSprite(tilesetImg, SPR.spike, TILE_SRC, sr.x - camX, sr.y, sr.w, sr.h, false, TILE_ART);
    }
    if (level.flag) {
      flagTime += 0;
      var frame = Math.floor(performance.now() / 400) % 2 === 0 ? SPR.flagA : SPR.flagB;
      var fr = tileRect(level.flag.c, level.flag.r, 26, 34, true);
      drawSprite(tilesetImg, frame, TILE_SRC, fr.x - camX, fr.y, fr.w, fr.h, false, TILE_ART);
    }
  }

  function drawEnemies() {
    for (var i = 0; i < enemies.length; i++) {
      var en = enemies[i];
      if (!en.alive) continue;
      var frame = Math.floor(en.animT * 6) % 2 === 0 ? CHAR.enemyA : CHAR.enemyB;
      drawSprite(charsetImg, frame, CHAR_SRC, en.x - camX, en.y, en.w, en.h, en.dir < 0);
    }
  }

  function drawPlayer() {
    if (invulnT > 0 && Math.floor(invulnT * 12) % 2 === 0) return;
    var frame = player.animT > 0 && Math.floor(player.animT * 8) % 2 === 0 ? CHAR.playerB : CHAR.playerA;
    drawSprite(charsetImg, frame, CHAR_SRC, player.x - camX - 3, player.y - 2, player.w + 8, player.h + 6, player.facing < 0);
  }

  function drawHUD() {
    for (var i = 0; i < MAX_LIVES; i++) {
      var spr = i < lives ? SPR.heartFull : SPR.heartEmpty;
      drawSprite(tilesetImg, spr, TILE_SRC, 10 + i * 26, 10, 22, 22, false, TILE_ART);
    }
    drawSprite(tilesetImg, SPR.coin, TILE_SRC, VIEW_W - 90, 10, 20, 20, false, TILE_ART);
    ctx.fillStyle = "#1a2438";
    ctx.font = "bold 16px sans-serif";
    ctx.textBaseline = "middle";
    ctx.fillText("x " + score, VIEW_W - 62, 22);

    if (bannerT > 0) {
      bannerT -= 1 / 60;
      ctx.globalAlpha = Math.min(1, bannerT);
      ctx.fillStyle = "rgba(26,36,56,0.55)";
      ctx.fillRect(VIEW_W / 2 - 90, 50, 180, 34);
      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.font = "bold 18px sans-serif";
      ctx.fillText("LEVEL " + (levelIndex + 1), VIEW_W / 2, 67);
      ctx.textAlign = "left";
      ctx.globalAlpha = 1;
    }
  }

  var lastTime = null;
  function loop(ts) {
    if (lastTime === null) lastTime = ts;
    var dt = Math.min((ts - lastTime) / 1000, 0.033);
    lastTime = ts;

    if (assetsReady >= 2) {
      if (state === "playing") {
        updatePlayer(dt);
        updateEnemies(dt);
        updateCamera();
      }
      drawBackground();
      if (level) {
        drawLevel();
        drawEnemies();
        drawPlayer();
        drawHUD();
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
